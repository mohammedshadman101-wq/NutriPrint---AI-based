<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NutriPrint AI Enterprise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>NutriPrint <span>AI</span></h1>
    </header>
    
    <main class="container">
        <section id="generator-section">
            <h2>Matrix Setup Controls</h2>
            <form id="blueprintForm">
                <input type="text" id="institutionName" placeholder="Enter Institutional Body" required>
                <button type="submit">Compile Optimization Matrix</button>
            </form>
            
            <div id="matrix-output" style="margin-top: 2rem;">
                <h3 id="institutionTitle"></h3>
                <div id="weeklyGrid" class="grid-container"></div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
